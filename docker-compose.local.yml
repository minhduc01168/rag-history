services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: daivietkids-frontend-dev
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_BASE_URL=http://localhost:8000
    depends_on:
      - backend
    networks:
      - daivietkids-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: daivietkids-backend-dev
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/daivietkids_db
      - CHROMA_HOST=chromadb
      - CHROMA_PORT=8000
      - EMBEDDING_SERVICE_URL=http://embedding_service:8002/embed
    volumes:
      - ./backend:/app
      - ./markdowns:/markdowns
    depends_on:
      postgres:
        condition: service_started
      chromadb:
        condition: service_started
      embedding_service:
        condition: service_started
    networks:
      - daivietkids-network

  postgres:
    image: postgis/postgis:15-3.4-alpine
    container_name: daivietkids-postgres-dev
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: daivietkids_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    networks:
      - daivietkids-network

  chromadb:
    image: chromadb/chroma:latest
    container_name: daivietkids-chroma-dev
    environment:
      - IS_PERSISTENT=TRUE
      - PERSIST_DIRECTORY=/data
      - ANONYMIZED_TELEMETRY=FALSE
    ports:
      - "8001:8000"
    volumes:
      - ./data/chroma:/data
    networks:
      - daivietkids-network

  embedding_service:
    build:
      context: ./embedding_service
      dockerfile: Dockerfile
    container_name: daivietkids-embedding-dev
    environment:
      - EMBEDDING_MODEL_NAME=microsoft/harrier-oss-v1-0.6b
      - MAX_SEQ_LENGTH=512
      - HF_HOME=/root/.cache/huggingface
      - TRANSFORMERS_CACHE=/root/.cache/huggingface
    ports:
      - "8002:8002"
    volumes:
      - ./data/hf_cache:/root/.cache/huggingface
    networks:
      - daivietkids-network

volumes:
  postgres_dev_data:

networks:
  daivietkids-network:
    driver: bridge
