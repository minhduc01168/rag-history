version: '3.8'

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - daivietkids-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/daivietkids_db
      - CHROMA_HOST=chromadb
      - CHROMA_PORT=8000
    depends_on:
      - postgres
      - chromadb
#      - redis
    networks:
      - daivietkids-network

  postgres:
    image: postgis/postgis:15-3.4-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: daivietkids_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - daivietkids-network
#
#  redis:
#    image: redis:7-alpine
#    ports:
#      - "6379:6379"
#    volumes:
#      - redis_data:/data
#    networks:
#      - daivietkids-network

  chromadb:
    image: chromadb/chroma:latest
    environment:
      # Bắt buộc để ChromaDB ghi dữ liệu ra đĩa thay vì lưu in-memory
      - IS_PERSISTENT=TRUE
      - PERSIST_DIRECTORY=/chroma/chroma
      - ANONYMIZED_TELEMETRY=FALSE
    ports:
      - "8001:8000"
    volumes:
      - chroma_data:/chroma/chroma
    networks:
      - daivietkids-network

  embedding_service:
    build:
      context: ./embedding_service
      dockerfile: Dockerfile
    environment:
      # Cache model HuggingFace vào volume để không tải lại mỗi lần rebuild
      - HF_HOME=/root/.cache/huggingface
      - TRANSFORMERS_CACHE=/root/.cache/huggingface
    ports:
      - "8002:8002"
    volumes:
      - hf_model_cache:/root/.cache/huggingface
    networks:
      - daivietkids-network

volumes:
  postgres_data:
  redis_data:
  chroma_data:        # Dữ liệu ChromaDB — KHÔNG xóa khi rebuild (chỉ mất khi down -v)
  hf_model_cache:     # Cache model HuggingFace — tránh tải lại model mỗi lần rebuild

networks:
  daivietkids-network:
    driver: bridge
