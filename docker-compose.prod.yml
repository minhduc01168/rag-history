services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: daivietkids-frontend-prod
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:80/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
    networks:
      - daivietkids-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: daivietkids-backend-prod
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/daivietkids_db
      - CHROMA_HOST=chromadb
      - CHROMA_PORT=8000
      - EMBEDDING_SERVICE_URL=http://embedding_service:8002/embed
    volumes:
      - ./backend:/app
      - ./markdowns:/markdowns:ro
    depends_on:
      postgres:
        condition: service_healthy
      chromadb:
        condition: service_healthy
      embedding_service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 25s
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
    networks:
      - daivietkids-network

  postgres:
    image: postgis/postgis:15-3.4-alpine
    container_name: daivietkids-postgres-prod
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: daivietkids_db
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d daivietkids_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - daivietkids-network

  chromadb:
    image: chromadb/chroma:latest
    container_name: daivietkids-chroma-prod
    restart: unless-stopped
    environment:
      - IS_PERSISTENT=TRUE
      - PERSIST_DIRECTORY=/data
      - ANONYMIZED_TELEMETRY=FALSE
    volumes:
      - chroma_prod_data:/data
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8000 && echo -e \"GET /api/v2/heartbeat HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n\" >&3 && grep -q \"200 OK\" <&3' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
    networks:
      - daivietkids-network

  embedding_service:
    build:
      context: ./embedding_service
      dockerfile: Dockerfile
    container_name: daivietkids-embedding-prod
    restart: unless-stopped
    environment:
      - EMBEDDING_MODEL_NAME=microsoft/harrier-oss-v1-0.6b
      - MAX_SEQ_LENGTH=512
      - HF_HOME=/root/.cache/huggingface
      - TRANSFORMERS_CACHE=/root/.cache/huggingface
    volumes:
      - hf_model_cache:/root/.cache/huggingface
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
    networks:
      - daivietkids-network

volumes:
  postgres_prod_data:
  chroma_prod_data:
  hf_model_cache:

networks:
  daivietkids-network:
    driver: bridge
